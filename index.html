<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4f0">
<meta name="app-version" content="2026-08-04.6">
<title>Ondee</title>
<link rel="stylesheet" href="style.css?v=2026-08-04.6">
</head>
<body>
  <main>
    <h1>Ondee</h1>
    <p class="subtitle">Assistant vocal d'arrosage</p>
    <p class="version" id="version-tag"></p>

    <button id="start-btn">Démarrer</button>

    <section class="status" id="status" hidden>
      <div class="status-row">
        <span class="status-label">Écran</span>
        <span class="status-value" id="status-wakelock">—</span>
      </div>
      <div class="status-row">
        <span class="status-label">Micro</span>
        <span class="status-value" id="status-mic">—</span>
      </div>
      <div class="status-row">
        <span class="status-label">État</span>
        <span class="status-value" id="status-vad">—</span>
      </div>
      <div class="energy-bar">
        <div class="energy-bar-fill" id="energy-fill"></div>
        <div class="energy-threshold" id="energy-threshold-marker"></div>
      </div>
    </section>

    <ul class="log" id="log" hidden></ul>
  </main>

  <script type="module" src="app.js?v=2026-08-04.6"></script>
</body>
</html>
