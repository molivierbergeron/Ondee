<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4f0">
<meta name="app-version" content="2026-08-04.14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ondee">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Ondee</title>
<link rel="stylesheet" href="style.css?v=2026-08-04.14">
</head>
<body>
  <main>
    <h1>Ondee</h1>
    <p class="subtitle">Assistant vocal d'arrosage</p>

    <button id="start-btn">Démarrer</button>
    <button class="stop-btn" id="stop-btn" hidden>Terminer la session</button>
    <!-- Hors du panneau « Détails techniques », qui est masqué tant que la
         session n'a pas démarré : ce bouton doit justement rester utilisable
         sans rien démarrer d'autre. -->
    <button class="stop-btn" id="test-voice-btn">Tester le son</button>

    <p class="etat-principal" id="etat-principal" hidden>
      <span class="etat-point" id="etat-point"></span>
      <span id="etat-texte">—</span>
    </p>

    <p class="last-response" id="last-response" hidden></p>

    <details class="status" id="status" hidden>
      <summary>Détails techniques</summary>
      <div class="status-row">
        <span class="status-label">Écran</span>
        <span class="status-value" id="status-wakelock">—</span>
      </div>
      <div class="status-row">
        <span class="status-label">Micro</span>
        <span class="status-value" id="status-mic">—</span>
      </div>
      <div class="status-row">
        <span class="status-label">État</span>
        <span class="status-value" id="status-vad">—</span>
      </div>
      <div class="status-row">
        <span class="status-label">Voix</span>
        <span class="status-value" id="status-voice">—</span>
      </div>
      <div class="status-row">
        <span class="status-label">Détecteur</span>
        <span class="status-value" id="status-flags">—</span>
      </div>
      <div class="energy-bar">
        <div class="energy-bar-fill" id="energy-fill"></div>
        <div class="energy-threshold" id="energy-threshold-marker"></div>
      </div>
      <button class="refresh-btn" id="refresh-btn" hidden>rafraîchir les capteurs</button>
    </details>

    <ul class="log" id="log" hidden></ul>

    <p class="version" id="version-tag"></p>
  </main>

  <script type="module" src="app.js?v=2026-08-04.14"></script>
</body>
</html>
