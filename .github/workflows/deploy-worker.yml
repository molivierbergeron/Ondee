name: Deploy Worker

on:
  push:
    branches:
      - claude/plant-watering-voice-assistant-yq8f7x
      - claude/new-session-qt68mr
      - main
    paths:
      - "worker/**"
      - "plants.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # Les tests du prompt tournent avant le déploiement : ils lisent
      # plants.json et attrapent les erreurs de données (synonyme partagé par
      # deux plantes, capteur assigné deux fois) avant qu'elles n'atteignent
      # Gemini.
      - name: Tests
        working-directory: .
        run: npm test

      - name: Déployer le Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # wrangler secret put lit la valeur sur stdin en mode non-interactif —
      # ça reste la clé qui est secrète, jamais cette commande elle-même.
      - name: Mettre à jour les secrets
        run: |
          echo "${{ secrets.GEMINI_API_KEY }}" | npx wrangler secret put GEMINI_API_KEY
          echo "${{ secrets.SHARED_TOKEN }}" | npx wrangler secret put SHARED_TOKEN
          echo "${{ secrets.ECOWITT_APPLICATION_KEY }}" | npx wrangler secret put ECOWITT_APPLICATION_KEY
          echo "${{ secrets.ECOWITT_API_KEY }}" | npx wrangler secret put ECOWITT_API_KEY
          echo "${{ secrets.ECOWITT_MAC }}" | npx wrangler secret put ECOWITT_MAC
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Fumée : confirme depuis un runner (accès réseau normal, contrairement
      # à l'environnement de dev) que le Worker répond réellement et que
      # l'appel Ecowitt en aval fonctionne avec les vraies clés.
      #
      # Ce qui est ASSERTÉ ici est le contrat du Worker, la partie qu'on
      # contrôle : statut HTTP, JSON parsable, champ transcription présent, et
      # plante_id soit null soit un id réel de plants.json.
      #
      # Ce qui est seulement SIGNALÉ (::warning::) est le comportement du
      # modèle sur un clip silencieux. Gemini y invente une plante avec
      # confiance « haute » — trois formulations de prompt différentes, trois
      # hallucinations, chaque fois en recrachant l'exemple le plus récent des
      # instructions. Ça ne se corrige pas par le prompt, donc en faire un
      # échec bloquant rendrait ce workflow rouge en permanence pour une
      # raison sur laquelle il n'a aucune prise. Voir README, section
      # « hallucination sur audio muet », pour la portée réelle et le plan.
      - name: Vérifier le déploiement
        run: |
          verifier_comprendre() {
            echo "--- $1 ---"
            reponse=$(curl -sS -w "\n%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.SHARED_TOKEN }}" \
              -H "Content-Type: audio/wav" \
              --data-binary @fixtures/silence.wav \
              "$2")
            code=$(tail -n1 <<< "$reponse")
            corps=$(sed '$d' <<< "$reponse")
            echo "$corps"
            [ "$code" = "200" ] || { echo "::error::HTTP $code sur $1"; exit 1; }
            jq -e . >/dev/null <<< "$corps" || { echo "::error::JSON invalide sur $1"; exit 1; }
            jq -e 'has("transcription")' >/dev/null <<< "$corps" \
              || { echo "::error::champ transcription absent — le journal client perd son seul témoin"; exit 1; }
            # assainirResultat() doit avoir filtré tout id inventé.
            id=$(jq -r '.plante_id // "null"' <<< "$corps")
            if [ "$id" != "null" ]; then
              jq -e --argjson id "$id" 'any(.[]; .id == $id)' >/dev/null < ../plants.json \
                || { echo "::error::plante_id $id absent de plants.json"; exit 1; }
              echo "::warning::Clip silencieux → plante $id identifiée. Hallucination connue du modèle, pas une régression du Worker."
            fi
          }

          echo "--- sans jeton (doit être 401) ---"
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            https://ondee-proxy.mo-bergeron.workers.dev/capteurs)
          echo "HTTP $code"
          [ "$code" = "401" ] || { echo "::error::auth ouverte : $code au lieu de 401"; exit 1; }

          echo "--- GET /capteurs ---"
          capteurs=$(curl -sS \
            -H "Authorization: Bearer ${{ secrets.SHARED_TOKEN }}" \
            https://ondee-proxy.mo-bergeron.workers.dev/capteurs)
          echo "$capteurs"
          jq -e '.readings | length > 0' <<< "$capteurs" > /dev/null \
            || { echo "::error::aucune lecture capteur"; exit 1; }

          verifier_comprendre \
            "POST /comprendre (silence)" \
            "https://ondee-proxy.mo-bergeron.workers.dev/comprendre"

          verifier_comprendre \
            "POST /comprendre?candidats=19,20 (silence, chemin désambiguïsation)" \
            "https://ondee-proxy.mo-bergeron.workers.dev/comprendre?candidats=19,20"
